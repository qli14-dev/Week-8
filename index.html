<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seaside Sunset - A Dreamlike Escape</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Loading memories...</p>
        </div>
    </div>

    <!-- Seashell Introduction Screen -->
    <div id="seashell-screen">
        <div class="seashell-container">
            <div class="seashell-glow"></div>
            <div class="seashell" id="seashell-trigger">
                <div class="seashell-spiral"></div>
                <div class="seashell-inner"></div>
            </div>
            <p class="instruction">Click the seashell to begin your journey</p>
        </div>
    </div>

    <!-- 3D Scene Canvas -->
    <canvas id="scene-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-overlay" class="hidden">
        <div class="memory-title">
            <h1>Seaside Sunset</h1>
            <p class="subtitle">A Dreamlike Escape</p>
        </div>

        <div class="controls-hint">
            <p>🖱️ Move mouse to look around the beach</p>
            <p>✨ Feel the ocean breeze and watch the waves</p>
        </div>

        <div class="atmosphere-text hidden" id="ocean-message">
            <p class="fade-text">The sound of waves carries you away...</p>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="ocean-waves-sound" loop>
        <!-- Ocean waves ambient sound -->
    </audio>
    <audio id="seashell-sound">
        <!-- Initial seashell ocean sound -->
    </audio>
    <audio id="ocean-breeze-sound" loop>
        <!-- Gentle ocean breeze ambient sound -->
    </audio>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Main Application Script -->
    <script src="app.js"></script>
</body>
</html>
