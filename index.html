<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamlike Memory - A Journey Back</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Loading memories...</p>
        </div>
    </div>

    <!-- Phone Introduction Screen -->
    <div id="phone-screen">
        <div class="phone-container">
            <div class="phone-glow"></div>
            <div class="phone">
                <div class="phone-screen-display">
                    <div class="music-app">
                        <div class="album-art">
                            <div class="vinyl-record"></div>
                        </div>
                        <p class="song-title">Summer Memory</p>
                        <p class="artist">Childhood Echoes</p>
                        <div class="play-button">
                            <div class="play-icon">▶</div>
                        </div>
                    </div>
                </div>
            </div>
            <p class="instruction">Tap the phone to play the song</p>
        </div>
    </div>

    <!-- 3D Scene Canvas -->
    <canvas id="scene-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-overlay" class="hidden">
        <div class="memory-title">
            <h1>Golden Afternoons</h1>
            <p class="subtitle">The Restaurant We Used to Visit</p>
        </div>

        <div class="controls-hint">
            <p>🖱️ Move mouse to look around</p>
            <p>🖱️ Click the noodles to eat</p>
        </div>

        <div class="atmosphere-text hidden" id="noodle-message">
            <p class="fade-text">The warmth and taste bring back so many memories...</p>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="background-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    <audio id="conversation-sound" loop>
        <source src="conversation.mp3" type="audio/mpeg">
    </audio>
    <audio id="eating-sound">
        <source src="eating.mp3" type="audio/mpeg">
    </audio>
    <audio id="transition-sound">
        <source src="transition.mp3" type="audio/mpeg">
    </audio>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Main Application Script -->
    <script src="app.js"></script>
</body>
</html>
