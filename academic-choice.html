<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Choice That Shapes You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #title {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s forwards;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        #title h1 {
            font-size: 2.5em;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        #title p {
            font-size: 1.2em;
            font-weight: 200;
            opacity: 0.8;
        }

        #instructions {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s 1s forwards;
            font-size: 1em;
            font-weight: 200;
        }

        #fragment-viewer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            color: white;
            max-width: 600px;
            pointer-events: all;
            opacity: 0;
            transition: all 0.5s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        #fragment-viewer.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        #fragment-viewer h2 {
            margin-bottom: 20px;
            font-size: 2em;
            font-weight: 300;
        }

        #fragment-viewer p {
            line-height: 1.8;
            font-size: 1.1em;
            font-weight: 200;
        }

        #close-viewer {
            margin-top: 30px;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        #close-viewer:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        #progress {
            position: absolute;
            top: 120px;
            right: 40px;
            color: white;
            font-size: 0.9em;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #progress.visible {
            opacity: 0.7;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        .portal-label {
            position: absolute;
            color: white;
            font-size: 1.3em;
            font-weight: 300;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .portal-label.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <div id="title">
            <h1>THE CHOICE</h1>
            <p>A decision that shapes your story</p>
        </div>

        <div id="instructions">
            Click a portal to explore that path • Interact with memories • Drag to rotate camera
        </div>

        <div id="progress">
            <span id="progress-text">Memories discovered: 0/0</span>
        </div>

        <div id="fragment-viewer">
            <h2 id="fragment-title"></h2>
            <p id="fragment-description"></p>
            <button id="close-viewer">Continue Exploring</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000510, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // OrbitControls
        class OrbitControls {
            constructor(camera, domElement) {
                this.camera = camera;
                this.domElement = domElement;
                this.target = new THREE.Vector3(0, 1, 0);
                this.enabled = true;
                this.rotateSpeed = 0.5;
                this.minDistance = 3;
                this.maxDistance = 20;
                this.autoRotate = false;
                this.autoRotateSpeed = 0.5;

                this.spherical = new THREE.Spherical();
                this.sphericalDelta = new THREE.Spherical();
                this.scale = 1;
                this.panOffset = new THREE.Vector3();

                this.rotateStart = new THREE.Vector2();
                this.rotateEnd = new THREE.Vector2();
                this.rotateDelta = new THREE.Vector2();

                this.state = 'none';

                this.domElement.addEventListener('mousedown', this.onMouseDown.bind(this));
                this.domElement.addEventListener('wheel', this.onMouseWheel.bind(this));
                this.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
            }

            onMouseDown(event) {
                if (!this.enabled) return;
                event.preventDefault();

                this.rotateStart.set(event.clientX, event.clientY);
                this.state = 'rotate';

                this.domElement.addEventListener('mousemove', this.onMouseMove.bind(this));
                this.domElement.addEventListener('mouseup', this.onMouseUp.bind(this));
            }

            onMouseMove(event) {
                if (!this.enabled) return;
                event.preventDefault();

                this.rotateEnd.set(event.clientX, event.clientY);
                this.rotateDelta.subVectors(this.rotateEnd, this.rotateStart).multiplyScalar(this.rotateSpeed);

                this.sphericalDelta.theta -= 2 * Math.PI * this.rotateDelta.x / this.domElement.clientHeight;
                this.sphericalDelta.phi -= 2 * Math.PI * this.rotateDelta.y / this.domElement.clientHeight;

                this.rotateStart.copy(this.rotateEnd);
            }

            onMouseUp() {
                if (!this.enabled) return;
                this.domElement.removeEventListener('mousemove', this.onMouseMove.bind(this));
                this.domElement.removeEventListener('mouseup', this.onMouseUp.bind(this));
                this.state = 'none';
            }

            onMouseWheel(event) {
                if (!this.enabled) return;
                event.preventDefault();

                if (event.deltaY < 0) {
                    this.scale /= 0.95;
                } else if (event.deltaY > 0) {
                    this.scale *= 0.95;
                }
            }

            update() {
                const offset = new THREE.Vector3();
                const quat = new THREE.Quaternion().setFromUnitVectors(camera.up, new THREE.Vector3(0, 1, 0));
                const quatInverse = quat.clone().invert();

                const lastPosition = new THREE.Vector3();
                const lastQuaternion = new THREE.Quaternion();

                offset.copy(this.camera.position).sub(this.target);
                offset.applyQuaternion(quat);

                this.spherical.setFromVector3(offset);

                if (this.autoRotate && this.state === 'none') {
                    this.sphericalDelta.theta -= 2 * Math.PI / 60 / 60 * this.autoRotateSpeed;
                }

                this.spherical.theta += this.sphericalDelta.theta;
                this.spherical.phi += this.sphericalDelta.phi;

                this.spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, this.spherical.phi));
                this.spherical.makeSafe();

                this.spherical.radius *= this.scale;
                this.spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this.spherical.radius));

                this.target.add(this.panOffset);

                offset.setFromSpherical(this.spherical);
                offset.applyQuaternion(quatInverse);

                this.camera.position.copy(this.target).add(offset);
                this.camera.lookAt(this.target);

                this.sphericalDelta.set(0, 0, 0);
                this.scale = 1;
                this.panOffset.set(0, 0, 0);

                return false;
            }
        }

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;

        // Raycaster for interactions
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredObject = null;

        // Game state
        let currentScene = 'initial';
        let viewedFragments = new Set();
        let totalFragments = 0;
        let finalSphereCreated = false;

        // Memory fragment data
        const homeCountryMemories = [
            {
                title: "Late Night Study Sessions",
                description: "You remember the warmth of studying together with friends at the library, sharing snacks and laughter between equations. The familiar faces, the inside jokes, the comfort of speaking your mother tongue without thinking.",
                position: { x: -6, y: 2, z: -2 },
                color: 0xffaa44
            },
            {
                title: "Family Dinners",
                description: "Sunday dinners around a crowded table. Your mother's cooking, your siblings' stories, the gentle chaos of home. The taste of tradition, the warmth of belonging, the unspoken understanding that comes from shared roots.",
                position: { x: -8, y: 3, z: 2 },
                color: 0xff6644
            },
            {
                title: "Festival Celebrations",
                description: "Dancing in the streets during festivals, colors everywhere, music you've known since childhood. Friends linking arms, moving together in perfect rhythm, celebrating traditions that connect you to generations past.",
                position: { x: -5, y: 1.5, z: 1 },
                color: 0xff88ff
            },
            {
                title: "Sunset Bike Rides",
                description: "Cycling through familiar streets as the sun sets, wind in your hair, your best friend pedaling beside you. Every corner holds a memory, every shortcut tells a story. This is the geography of your heart.",
                position: { x: -7, y: 2.5, z: -1 },
                color: 0xffdd66
            },
            {
                title: "Classroom Moments",
                description: "Sitting in classrooms where teachers know your name, your strengths, your dreams. Raising your hand without fear, laughing at jokes in your language, being part of a community that sees you completely.",
                position: { x: -6.5, y: 3.5, z: 0 },
                color: 0x66ddff
            },
            {
                title: "Birthday Surprises",
                description: "Your friends bursting into your room with a cake, singing off-key but with so much love. Gifts wrapped in newspaper, messages written in shared language, the joy of being celebrated by people who truly know you.",
                position: { x: -5.5, y: 2, z: -3 },
                color: 0xff66dd
            }
        ];

        const abroadMemories = [
            {
                title: "First Night Alone",
                description: "The weight of silence in your new room. Foreign sounds drifting through the window. You sit at your desk under the soft lamp light, thousands of miles from home, and feel yourself becoming someone new in the quiet.",
                position: { x: 6, y: 2, z: -2 },
                color: 0x6688ff
            },
            {
                title: "Walking Unknown Streets",
                description: "Wandering through a city where no one knows your name. The liberation of anonymity. The ache of invisibility. Each step is both lonely and exhilarating—you are reinventing yourself with every breath.",
                position: { x: 8, y: 3, z: 2 },
                color: 0x8866ff
            },
            {
                title: "Late Night Study",
                description: "3 AM in the library. Just you and the hum of computers. The discipline you've discovered within yourself surprises you. In the solitude, you've found a strength you didn't know existed.",
                position: { x: 5, y: 1.5, z: 1 },
                color: 0x66aaff
            },
            {
                title: "Small Courage",
                description: "Ordering coffee in an accent that still feels foreign in your mouth. The barista smiles. It's a tiny victory, but it feels enormous. Each day brings small acts of bravery that reshape who you are.",
                position: { x: 7, y: 2.5, z: -1 },
                color: 0x9966ff
            },
            {
                title: "Midnight Reflection",
                description: "Standing at your window, watching a city sleep. You miss home with an ache that feels physical, yet you've never felt more alive. Growth, you realize, often happens in the space between comfort and belonging.",
                position: { x: 6.5, y: 3.5, z: 0 },
                color: 0x6699ff
            },
            {
                title: "Finding Your Voice",
                description: "The moment you realize you're thinking in a new language. The moment you stop translating and start simply being. You've carried your roots with you, but you've also planted new ones in foreign soil.",
                position: { x: 5.5, y: 2, z: -3 },
                color: 0x7788ff
            }
        ];

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.6);
        mainLight.position.set(5, 10, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        // Ground
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x0a0a1a,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Create portal
        function createPortal(position, color, label) {
            const group = new THREE.Group();

            // Portal ring
            const ringGeometry = new THREE.TorusGeometry(1.5, 0.1, 16, 100);
            const ringMaterial = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.5,
                metalness: 0.8,
                roughness: 0.2
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.y = Math.PI / 2;
            group.add(ring);

            // Portal surface
            const portalGeometry = new THREE.CircleGeometry(1.4, 32);
            const portalMaterial = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.3,
                transparent: true,
                opacity: 0.6,
                side: THREE.DoubleSide
            });
            const portal = new THREE.Mesh(portalGeometry, portalMaterial);
            portal.rotation.y = Math.PI / 2;
            group.add(portal);

            // Glow effect
            const glowGeometry = new THREE.CircleGeometry(1.8, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.2,
                side: THREE.DoubleSide
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            glow.rotation.y = Math.PI / 2;
            group.add(glow);

            group.position.copy(position);
            group.userData = { type: 'portal', label: label };

            return group;
        }

        // Portals
        const homePortal = createPortal(
            new THREE.Vector3(-4, 2, 0),
            0xff6b6b,
            'Study in Home Country'
        );
        scene.add(homePortal);

        const abroadPortal = createPortal(
            new THREE.Vector3(4, 2, 0),
            0x4ecdc4,
            'Study Abroad'
        );
        scene.add(abroadPortal);

        // Create memory fragment
        function createFragment(data, sceneType) {
            const group = new THREE.Group();

            // Crystal-like geometry
            const geometry = new THREE.OctahedronGeometry(0.3, 0);
            const material = new THREE.MeshStandardMaterial({
                color: data.color,
                emissive: data.color,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.8,
                metalness: 0.8,
                roughness: 0.2
            });
            const crystal = new THREE.Mesh(geometry, material);
            group.add(crystal);

            // Glow
            const glowGeometry = new THREE.SphereGeometry(0.5, 16, 16);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: data.color,
                transparent: true,
                opacity: 0.2
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            group.add(glow);

            group.position.set(data.position.x, data.position.y, data.position.z);
            group.userData = {
                type: 'fragment',
                sceneType: sceneType,
                fragmentData: data,
                baseY: data.position.y,
                rotationSpeed: Math.random() * 0.02 + 0.01,
                floatOffset: Math.random() * Math.PI * 2
            };

            return group;
        }

        let fragments = [];

        // Create home country scene
        function createHomeScene() {
            // Clear existing fragments
            fragments.forEach(f => scene.remove(f));
            fragments = [];

            // Create colorful fragments
            homeCountryMemories.forEach(memory => {
                const fragment = createFragment(memory, 'home');
                fragments.push(fragment);
                scene.add(fragment);
            });

            // Update scene atmosphere
            scene.fog.color.setHex(0x2a1a0a);
            scene.fog.density = 0.015;
            document.body.style.background = 'linear-gradient(to bottom, #1a0a00, #000000)';

            // Add warm lighting
            const warmLight = new THREE.PointLight(0xffaa44, 1, 20);
            warmLight.position.set(-6, 5, 0);
            scene.add(warmLight);

            const warmLight2 = new THREE.PointLight(0xff6644, 0.8, 15);
            warmLight2.position.set(-8, 3, 2);
            scene.add(warmLight2);

            totalFragments = homeCountryMemories.length;
            updateProgress();
        }

        // Create abroad scene
        function createAbroadScene() {
            // Clear existing fragments
            fragments.forEach(f => scene.remove(f));
            fragments = [];

            // Create misty fragments
            abroadMemories.forEach(memory => {
                const fragment = createFragment(memory, 'abroad');
                fragments.push(fragment);
                scene.add(fragment);
            });

            // Update scene atmosphere
            scene.fog.color.setHex(0x0a0a1a);
            scene.fog.density = 0.025;
            document.body.style.background = 'linear-gradient(to bottom, #000510, #000000)';

            // Add cool lighting
            const coolLight = new THREE.PointLight(0x6688ff, 0.8, 20);
            coolLight.position.set(6, 5, 0);
            scene.add(coolLight);

            const coolLight2 = new THREE.PointLight(0x8866ff, 0.6, 15);
            coolLight2.position.set(8, 3, 2);
            scene.add(coolLight2);

            totalFragments = abroadMemories.length;
            updateProgress();
        }

        // Create final sphere
        function createFinalSphere() {
            if (finalSphereCreated) return;

            const geometry = new THREE.SphereGeometry(0.8, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0xffffff,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.9,
                metalness: 0.9,
                roughness: 0.1
            });
            const sphere = new THREE.Mesh(geometry, material);

            const yPos = currentScene === 'home' ? 2 : 2;
            const xPos = currentScene === 'home' ? -6 : 6;
            sphere.position.set(xPos, yPos, 0);

            sphere.userData = {
                type: 'finalSphere',
                baseY: yPos,
                floatOffset: 0
            };

            scene.add(sphere);
            finalSphereCreated = true;

            // Add particles around it
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 100;
            const posArray = new Float32Array(particlesCount * 3);

            for (let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 5;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.05,
                color: 0xffffff,
                transparent: true,
                opacity: 0.6
            });

            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            particlesMesh.position.copy(sphere.position);
            scene.add(particlesMesh);
        }

        // Update progress
        function updateProgress() {
            const progressEl = document.getElementById('progress');
            const progressText = document.getElementById('progress-text');
            progressText.textContent = `Memories discovered: ${viewedFragments.size}/${totalFragments}`;
            progressEl.classList.add('visible');

            if (viewedFragments.size === totalFragments && totalFragments > 0) {
                createFinalSphere();
            }
        }

        // Show fragment viewer
        function showFragment(fragmentData) {
            document.getElementById('fragment-title').textContent = fragmentData.title;
            document.getElementById('fragment-description').textContent = fragmentData.description;
            document.getElementById('fragment-viewer').classList.add('active');
            controls.enabled = false;
        }

        // Close fragment viewer
        document.getElementById('close-viewer').addEventListener('click', () => {
            document.getElementById('fragment-viewer').classList.remove('active');
            controls.enabled = true;
        });

        // Show merge sequence
        function showMergeSequence() {
            // Hide UI
            document.getElementById('title').style.opacity = '0';
            document.getElementById('instructions').style.opacity = '0';
            document.getElementById('progress').style.opacity = '0';

            // Create merge effect
            setTimeout(() => {
                const finalText = document.createElement('div');
                finalText.style.cssText = `
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    color: white;
                    text-align: center;
                    font-size: 2em;
                    font-weight: 300;
                    opacity: 0;
                    transition: opacity 2s;
                    pointer-events: none;
                    max-width: 800px;
                    line-height: 1.6;
                `;
                finalText.innerHTML = `
                    <h2 style="margin-bottom: 30px; font-size: 1.5em;">Every choice shapes us</h2>
                    <p style="font-size: 0.8em; font-weight: 200;">
                        Whether surrounded by the familiar warmth of home<br>
                        or challenged by the solitude of the unknown,<br>
                        each path carves its own beauty into who we become.
                    </p>
                `;
                document.getElementById('ui-overlay').appendChild(finalText);

                setTimeout(() => {
                    finalText.style.opacity = '1';
                }, 100);
            }, 1000);

            // Animate scene
            scene.fog.density = 0.005;
            const mergeLight = new THREE.PointLight(0xffffff, 2, 50);
            mergeLight.position.set(0, 10, 0);
            scene.add(mergeLight);
        }

        // Mouse move for hover effects
        renderer.domElement.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (hoveredObject) {
                hoveredObject.scale.set(1, 1, 1);
                hoveredObject = null;
                document.body.style.cursor = 'default';
            }

            for (let intersect of intersects) {
                let obj = intersect.object;
                while (obj.parent && !obj.userData.type) {
                    obj = obj.parent;
                }

                if (obj.userData.type === 'portal' || obj.userData.type === 'fragment' || obj.userData.type === 'finalSphere') {
                    hoveredObject = obj;
                    obj.scale.set(1.1, 1.1, 1.1);
                    document.body.style.cursor = 'pointer';
                    break;
                }
            }
        });

        // Click handler
        renderer.domElement.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            for (let intersect of intersects) {
                let obj = intersect.object;
                while (obj.parent && !obj.userData.type) {
                    obj = obj.parent;
                }

                if (obj.userData.type === 'portal') {
                    controls.autoRotate = false;

                    if (obj.userData.label === 'Study in Home Country') {
                        currentScene = 'home';
                        createHomeScene();

                        // Hide portals
                        homePortal.visible = false;
                        abroadPortal.visible = false;

                        // Update camera
                        controls.target.set(-6, 2, 0);
                    } else {
                        currentScene = 'abroad';
                        createAbroadScene();

                        // Hide portals
                        homePortal.visible = false;
                        abroadPortal.visible = false;

                        // Update camera
                        controls.target.set(6, 2, 0);
                    }

                    document.getElementById('title').style.display = 'none';
                    document.getElementById('instructions').textContent = 'Click memories to explore • Drag to look around';

                    break;
                } else if (obj.userData.type === 'fragment') {
                    const fragmentId = `${obj.userData.sceneType}-${obj.userData.fragmentData.title}`;
                    viewedFragments.add(fragmentId);
                    showFragment(obj.userData.fragmentData);
                    updateProgress();
                    break;
                } else if (obj.userData.type === 'finalSphere') {
                    showMergeSequence();
                    break;
                }
            }
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Animate portals
            if (homePortal.visible) {
                homePortal.rotation.z += 0.005;
                homePortal.children[2].material.opacity = 0.2 + Math.sin(Date.now() * 0.002) * 0.1;
            }

            if (abroadPortal.visible) {
                abroadPortal.rotation.z -= 0.005;
                abroadPortal.children[2].material.opacity = 0.2 + Math.sin(Date.now() * 0.002) * 0.1;
            }

            // Animate fragments
            fragments.forEach((fragment, index) => {
                fragment.rotation.y += fragment.userData.rotationSpeed;
                fragment.rotation.x += fragment.userData.rotationSpeed * 0.5;

                const time = Date.now() * 0.001;
                fragment.position.y = fragment.userData.baseY + Math.sin(time + fragment.userData.floatOffset) * 0.3;

                // Pulse glow
                fragment.children[1].material.opacity = 0.2 + Math.sin(time * 2 + index) * 0.1;
            });

            // Animate final sphere
            scene.children.forEach(child => {
                if (child.userData.type === 'finalSphere') {
                    child.rotation.y += 0.01;
                    const time = Date.now() * 0.001;
                    child.position.y = child.userData.baseY + Math.sin(time) * 0.2;
                    child.material.emissiveIntensity = 0.5 + Math.sin(time * 2) * 0.3;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
    </script>
</body>
</html>
